<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Timetable - Apna Time Table Banao</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
  body{background:#0f172a;color:white;min-height:100vh;padding:15px;}
  .container{max-width:500px;margin:auto;}
  .card{background:#1e293b;border-radius:20px;padding:20px;margin-top:15px;border:1px solid #334155;}
  h1{color:#38bdf8;text-align:center;font-size:26px;}
  h2{color:#38bdf8;margin-bottom:15px;font-size:20px;}
  .step{display:none;}
  .step.active{display:block;animation:fade 0.3s;}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  label{display:block;margin:12px 0 6px;color:#cbd5e1;font-size:14px;}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white;font-size:15px;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .opt{padding:12px;border:1px solid #334155;border-radius:10px;text-align:center;cursor:pointer;background:#0f172a;}
  .opt.selected{background:#38bdf8;color:#0f172a;font-weight:bold;border-color:#38bdf8;}
  .opt2{grid-column:span 2;}
  button{width:100%;padding:14px;border:none;border-radius:12px;background:#38bdf8;color:#0f172a;font-weight:bold;font-size:16px;margin-top:20px;cursor:pointer;}
  .progress{height:6px;background:#1e293b;border-radius:10px;overflow:hidden;margin:15px 0;}
  .bar{height:100%;background:#38bdf8;transition:0.3s;}
  table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px;}
  th{background:#38bdf8;color:#0f172a;padding:10px;}
  td{padding:10px;text-align:center;border:1px solid #334155;}
  .badge{padding:3px 8px;border-radius:20px;font-size:11px;background:#1e293b;}
  .play{background:#22c55e20;color:#22c55e;border:1px solid #22c55e40}
  .study{background:#38bdf820;color:#38bdf8;border:1px solid #38bdf840}
  .sleep{background:#a78bfa20;color:#a78bfa;border:1px solid #a78bfa40}
</style>
</head>
<body>
<div class="container">
  <h1>📅 Smart Timetable</h1>
  <p style="text-align:center;color:#94a3b8;font-size:13px">Har bache ka apna personal time table</p>
  <div class="progress"><div class="bar" id="bar" style="width:20%"></div></div>

  <div class="step active" id="s1">
    <div class="card">
      <h2>👋 Chalo shuru karte hain!</h2>
      <label>Tumhara Naam kya hai?</label>
      <input id="name" placeholder="Jaise - Aman">
      <label>Class kaunsi hai?</label>
      <select id="class"><option value="">Select Class</option><option>Class 1-5</option><option>Class 6-8</option><option>Class 9-10</option><option>Class 11-12</option></select>
    </div>
    <button onclick="next(2)">Aage Badho →</button>
  </div>

  <div class="step" id="s2">
    <div class="card">
      <h2>📚 Padna kya pasand hai?</h2>
      <label>2 subjects chuno jo sabse zyada pasand hai</label>
      <div class="options" id="subOpts">
        <div class="opt" onclick="toggleSub(this)">Math</div>
        <div class="opt" onclick="toggleSub(this)">Science</div>
        <div class="opt" onclick="toggleSub(this)">English</div>
        <div class="opt" onclick="toggleSub(this)">Hindi</div>
        <div class="opt" onclick="toggleSub(this)">SST</div>
        <div class="opt" onclick="toggleSub(this)">Computer</div>
      </div>
    </div>
